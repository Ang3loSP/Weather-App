<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Weather App | Live Forecast | 3 API Methods</title>
    <link rel="stylesheet" href="Styles.css">
    <!-- Google Material Icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,1" />
    <!-- jQuery - Required for jQuery AJAX method -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="Script.js" defer></script>
</head>
<body>

    <main class="main-container">

        <header class="input-container">
            <input class="city-input" placeholder="Search city..." type="text" aria-label="City name">
            <button class="search-btn" aria-label="Search">
                <span class="material-symbols-outlined">search</span>
            </button>
        </header>

        <!-- API Method Selector - Dynamic buttons added by JavaScript -->
        <div id="methodSelector" class="method-selector"></div>

        <!-- Weather main display section (hidden initially) -->
        <section class="weather-info" style="display: none;">
            <div class="location-date-container">
                <div class="location">
                    <span class="material-symbols-outlined location-icon">location_on</span>
                    <h4 class="country-txt">City</h4>
                </div>
                <h5 class="current-date-txt regular-txt">--</h5>
            </div>

            <div class="weather-summary-container">
                <img src="Assets/weather/clouds.svg" alt="weather icon" class="weather-summary-img">
                <div class="weather-summary-info">
                    <h1 class="temp-txt">-- °C</h1>
                    <h3 class="condition-txt regular-txt">---</h3>
                </div>
            </div>

            <div class="weather-conditions-container">
                <div class="condition-item">
                    <span class="material-symbols-outlined">humidity_mid</span>
                    <div class="condition-info">
                        <h5 class="regular-txt">Humidity</h5>
                        <h5 class="humidity-value-txt">--%</h5>
                    </div>
                </div>
                <div class="condition-item">
                    <span class="material-symbols-outlined">air</span>
                    <div class="condition-info">
                        <h5 class="regular-txt">Wind Speed</h5>
                        <h5 class="wind-value-txt">-- km/h</h5>
                    </div>
                </div>
            </div>

            <div class="forecast-items-container">
                <!-- 5-day forecast will be injected here -->
            </div>
        </section>

        <!-- Initial message: search for a city -->
        <section class="search-city section-message">
            <img src="Assets/message/search-city.png" alt="search illustration">
            <div>
                <h1>Find Weather</h1>
                <h4 class="regular-txt">Enter a city to get current conditions & 5-day forecast</h4>
                <p class="api-hint" style="font-size: 11px; margin-top: 10px; opacity: 0.7;">⬆️ Click buttons above to switch API methods ⬆️</p>
            </div>
        </section>

        <!-- Not found message (hidden initially) -->
        <section class="not-found section-message" style="display: none;">
            <img src="Assets/message/not-found.png" alt="not found">
            <div>
                <h1>City not found</h1>
                <h4 class="regular-txt">Please check the name or try another city</h4>
            </div>
        </section>
    </main>
</body>
</html>
